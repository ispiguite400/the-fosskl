<!DOCTYPE html>
<!--
  SculptFree 1.0.0 — standalone build
  Generated by build.js from index.html plus src/. Do not edit this file;
  edit the sources and run "node build.js" again.

  One file, no dependencies, no network: open it straight from disk.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SculptFree — sculpt in 3D, export for free</title>
<meta name="description" content="A digital sculpting app that runs in one HTML file. Dynamic topology, voxel remeshing, 18 brushes, vertex painting, and OBJ / STL / PLY / GLB import and export with nothing locked.">
<meta name="theme-color" content="#0d1014">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff8a4c' stroke-width='1.8' stroke-linejoin='round'%3E%3Cpath d='M12 2.6 20.4 12 12 21.4 3.6 12Z'/%3E%3Cpath d='M12 2.6v18.8M3.6 12h16.8'/%3E%3C/svg%3E">
<style>
/*
 * SculptFree — interface styles.
 *
 * The screen is the model. Everything else floats over it in as few
 * controls as possible: brushes down the left, size and strength along the
 * bottom, one menu button. Anything deeper opens as a sheet.
 */

:root {
  --bg: #0d1014;
  --panel: #161a21;
  --panel-2: #1d232c;
  --panel-3: #252c37;
  --line: #2b323d;
  --line-soft: #222831;
  --text: #e8edf4;
  --text-dim: #949fae;
  --text-faint: #646f7e;
  --accent: #ff8a4c;
  --accent-dim: #c96a38;
  --accent-soft: rgba(255, 138, 76, 0.16);
  --glass: rgba(20, 24, 30, 0.74);
  --blue: #5aa9ff;
  --green: #5ed39a;
  --red: #ff6b6b;
  --radius: 8px;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
}

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ------------------------------------------------------- the canvas */

#app { position: fixed; inset: 0; background: #000; }
#view { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#view.navigating { cursor: grabbing; }

#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.spring { flex: 1; pointer-events: none; }

#radius-preview {
  position: absolute;
  border: 1.5px solid rgba(255, 255, 255, 0.9);
  border-radius: 50%;
  pointer-events: none;
  display: none;
}

/* --------------------------------------------------- floating buttons */

button.round, .tool {
  background: var(--glass);
  border: 1px solid var(--line);
  color: var(--text-dim);
  display: grid;
  place-items: center;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: color 0.12s, border-color 0.12s, background 0.12s;
}
button.round { width: 38px; height: 38px; border-radius: 50%; }
button.round.big { width: 44px; height: 44px; }
button.round.small { width: 30px; height: 30px; background: none; border-color: transparent; }
button.round svg { width: 18px; height: 18px; }
button.round.big svg { width: 21px; height: 21px; }
button.round.small svg { width: 16px; height: 16px; }
button.round:hover:not(:disabled), .tool:hover { color: var(--text); border-color: var(--panel-3); }
button.round:disabled { opacity: 0.3; cursor: default; }
button.round.on, .tool.on {
  color: var(--accent);
  border-color: var(--accent-dim);
  background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--glass);
}

#bar-top {
  position: absolute;
  top: 12px; left: 12px; right: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
#title-chip {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text-dim);
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 7px 13px;
  backdrop-filter: blur(10px);
  white-space: nowrap;
  flex: none;
}
#title-chip:hover { color: var(--text); border-color: var(--panel-3); }
/* the triangle budget: amber as it fills, red once over */
#title-chip.near { color: var(--accent); border-color: var(--accent-dim); }
#title-chip.over { color: #ffc9c9; border-color: var(--red); background: rgba(255, 107, 107, 0.16); }

#brushes {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tool { width: 46px; height: 46px; border-radius: 13px; }
.tool svg { width: 23px; height: 23px; }
.tool.more { border-style: dashed; }

#bar-right {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#bar-bottom {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  max-width: calc(100vw - 150px);
}
.pill {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 23px;
  padding: 7px 14px;
  backdrop-filter: blur(10px);
  width: 215px;
  max-width: 45vw;
}
.pill > svg { width: 16px; height: 16px; color: var(--text-faint); flex: none; }
.pill .val {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text);
  width: 32px;
  text-align: right;
  flex: none;
}

#stats {
  position: absolute;
  left: 14px;
  bottom: 16px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-faint);
  pointer-events: none;
  white-space: nowrap;
}

/* ------------------------------------------------ range input styling */

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1 1 40px;
  /* a range input's intrinsic min-content width is ~129px, and min-width is
     a floor rather than a cap, so without this the sliders refuse to shrink
     and push their container off the edge of a phone screen */
  min-width: 0;
  height: 4px;
  border-radius: 3px;
  background: var(--panel-3);
  outline: none;
  margin: 0;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text);
  border: 3px solid #111418;
  box-shadow: 0 0 0 1px var(--line);
  cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--text);
  border: 2px solid #111418;
  cursor: pointer;
}

/* ------------------------------------------------------------ sheets */

#sheets { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
.sheet {
  position: absolute;
  bottom: 12px;
  left: 50%;
  margin-left: calc(min(430px, 100vw - 24px) / -2);
  width: min(430px, calc(100vw - 24px));
  max-height: min(78vh, 720px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  pointer-events: auto;
  transform: translateY(calc(100% + 24px));
  transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
.sheet.open { transform: none; }
.sheet-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 12px 10px 16px;
  border-bottom: 1px solid var(--line-soft);
}
.sheet-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.sheet-body { overflow-y: auto; padding: 6px 8px 14px; overscroll-behavior: contain; }
.sheet-body::-webkit-scrollbar { width: 8px; }
.sheet-body::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 4px; }

.sheet-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  background: none;
  border: 0;
  padding: 10px 10px;
  border-radius: 10px;
  color: var(--text);
  text-align: left;
}
.sheet-row:hover { background: var(--panel-2); }
.sheet-row > svg { width: 19px; height: 19px; color: var(--text-dim); flex: none; }
.sheet-row .no-icon { width: 19px; flex: none; }
.sheet-label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sheet-label b { font-weight: 550; font-size: 13.5px; }
.sheet-label small { color: var(--text-faint); font-size: 11.5px; line-height: 1.35; }
.sheet-row > svg.go { width: 15px; height: 15px; color: var(--text-faint); transform: rotate(-90deg); }
.sheet-row.danger:hover { background: rgba(255, 107, 107, 0.12); }
.sheet-row.danger > svg { color: var(--red); }
.sheet-group {
  font-size: 10.5px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 14px 10px 4px;
}
.row-note {
  font-size: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  border-radius: 10px;
  padding: 2px 7px;
  flex: none;
}
.sheet-note { color: var(--text-faint); font-size: 11.5px; line-height: 1.5; margin: 10px 10px 4px; }
.sheet-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 10px 4px; }

.switch {
  width: 36px;
  height: 21px;
  border-radius: 12px;
  background: var(--panel-3);
  border: 1px solid var(--line);
  position: relative;
  flex: none;
  transition: background 0.15s, border-color 0.15s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: left 0.15s, background 0.15s;
}
.switch.on { background: var(--accent-soft); border-color: var(--accent-dim); }
.switch.on::after { left: 17px; background: var(--accent); }

.brush-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 8px 2px; }
.brush-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 9px 4px 7px;
  display: grid;
  place-items: center;
  gap: 3px;
  color: var(--text);
}
.brush-card svg { width: 22px; height: 22px; color: var(--text-dim); }
.brush-card b { font-size: 10.5px; font-weight: 550; text-align: center; line-height: 1.15; }
.brush-card small { font-family: var(--mono); font-size: 9px; color: var(--text-faint); }
.brush-card:hover, .brush-card.on { border-color: var(--accent-dim); background: var(--accent-soft); }
.brush-card:hover svg, .brush-card.on svg { color: var(--accent); }

/* ------------------------------------------------- shared form widgets */

.row { display: flex; align-items: center; gap: 9px; margin: 8px 10px; }
.row.wrap { flex-wrap: wrap; }
.row > label:not(.check) { color: var(--text-dim); flex: 0 0 auto; width: 74px; font-size: 12px; }
.row > .check { flex: 0 1 auto; }
.hint { color: var(--text-faint); font-size: 11.5px; line-height: 1.5; margin: 6px 10px 8px; }

.slider { flex: 1 1 auto; display: flex; align-items: center; gap: 9px; min-width: 0; }
.slider .num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  flex: 0 0 58px;
  width: 58px;
  min-width: 0;
  text-align: right;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 5px;
}
.slider .num:focus { border-color: var(--accent); }

select, input[type=text], input[type=number] {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 6px 8px;
  flex: 1;
  min-width: 0;
}
select:hover { border-color: var(--panel-3); }
input[type=color] {
  width: 38px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  flex: none;
}

.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { display: none; }
.check .box {
  width: 17px;
  height: 17px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  display: grid;
  place-items: center;
  flex: none;
}
.check .box svg { width: 12px; height: 12px; opacity: 0; color: #12151a; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box svg { opacity: 1; }

.btn {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  white-space: nowrap;
  font-size: 12.5px;
}
.btn:hover:not(:disabled) { background: var(--panel-3); border-color: var(--panel-3); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.grow { flex: 1; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #17120e; font-weight: 600; }
.btn.accent:hover:not(:disabled) { background: #ff9a63; border-color: #ff9a63; }
.btn.danger:hover:not(:disabled) { background: rgba(255, 107, 107, 0.14); border-color: var(--red); color: #ffc9c9; }
.btn svg { width: 15px; height: 15px; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 10px; }
.btn-grid.three { grid-template-columns: 1fr 1fr 1fr; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: 1; }
.seg button {
  flex: 1;
  background: var(--panel-2);
  border: 0;
  border-right: 1px solid var(--line);
  padding: 7px 4px;
  color: var(--text-dim);
  font-size: 12px;
}
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.seg button:hover:not(.on) { background: var(--panel-3); color: var(--text); }

.swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 8px; }
.swatch {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  padding: 0;
}
.swatch.on { box-shadow: 0 0 0 2px var(--accent); }

.matcaps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; padding: 4px 10px 6px; }
.matcap {
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid transparent;
  padding: 0;
  overflow: hidden;
  background: #000;
}
.matcap canvas { width: 100%; height: 100%; display: block; }
.matcap.on { border-color: var(--accent); }

#objects { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px 2px; }
.obj-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 7px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: var(--panel-2);
}
.obj-row.on { border-color: var(--accent-dim); background: var(--accent-soft); }
.obj-row .name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: none;
  border: 0;
  padding: 3px 4px;
  border-radius: 5px;
}
.obj-row .name:focus { background: var(--panel); }
.obj-row .count { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
.obj-row button {
  background: none;
  border: 0;
  color: var(--text-dim);
  padding: 3px;
  border-radius: 5px;
  display: grid;
  place-items: center;
}
.obj-row button:hover { color: var(--text); background: var(--panel-3); }
.obj-row button svg { width: 15px; height: 15px; }
.obj-row button.off { opacity: 0.4; }

/* ---------------------------------------------------------- dialogs */

.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 9, 0.66);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 16px;
  backdrop-filter: blur(3px);
}
.backdrop[hidden] { display: none; }

.dialog {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  width: min(520px, 100%);
  max-height: min(86vh, 860px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.dialog.wide { width: min(700px, 100%); }
.dialog > header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
  font-size: 14.5px;
}
.dialog > header svg { width: 18px; height: 18px; color: var(--accent); }
.dialog > header .close { margin-left: auto; }
.dialog > header .close svg { color: var(--text-faint); }
.dialog > .content { padding: 12px 8px; overflow-y: auto; }
.dialog > footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  background: var(--panel-2);
  flex-wrap: wrap;
}
.dialog h4 {
  margin: 14px 10px 6px;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-faint);
}
.dialog h4:first-child { margin-top: 2px; }
.dialog p { margin: 8px 10px; color: var(--text-dim); line-height: 1.55; }
.dialog code {
  font-family: var(--mono);
  font-size: 11.5px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 4px;
}
.dialog pre { margin: 8px 10px; }

.prim-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 2px 10px; }
.prim {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 12px 8px;
  display: grid;
  place-items: center;
  gap: 5px;
  color: var(--text);
}
.prim svg { width: 32px; height: 32px; color: var(--text-dim); }
.prim b { font-size: 12.5px; font-weight: 600; }
.prim small { color: var(--text-faint); font-size: 10.5px; text-align: center; line-height: 1.3; }
.prim.on, .prim:hover { border-color: var(--accent-dim); background: var(--accent-soft); }
.prim.on svg, .prim:hover svg { color: var(--accent); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 12px; margin: 8px 10px; }
.kv dt { color: var(--text-faint); }
.kv dd { margin: 0; font-family: var(--mono); }

.shortcut-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 22px; padding: 0 10px; }
.shortcut-grid dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: 12px; }
.shortcut-grid dt { font-family: var(--mono); font-size: 11px; color: var(--accent); white-space: nowrap; }
.shortcut-grid dd { margin: 0; color: var(--text-dim); }

.warn {
  background: rgba(255, 138, 76, 0.1);
  border: 1px solid var(--accent-dim);
  border-radius: 9px;
  padding: 9px 11px;
  color: #ffd2b5;
  font-size: 12px;
  line-height: 1.5;
  margin: 8px 10px;
}
.warn.bad { background: rgba(255, 107, 107, 0.1); border-color: var(--red); color: #ffcfcf; }
.warn.ok { background: rgba(94, 211, 154, 0.1); border-color: var(--green); color: #c8f4de; }

/* --------------------------------------------------------- overlays */

#toasts {
  position: fixed;
  bottom: 74px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 7px;
  z-index: 120;
  pointer-events: none;
  align-items: center;
}
.toast {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 9px 14px;
  box-shadow: var(--shadow);
  font-size: 12.5px;
  max-width: 78vw;
  animation: toast-in 0.18s ease-out;
}
.toast.bad { border-left-color: var(--red); }
.toast.ok { border-left-color: var(--green); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

#busy {
  position: fixed;
  inset: 0;
  background: rgba(6, 8, 11, 0.66);
  display: grid;
  place-items: center;
  z-index: 200;
  backdrop-filter: blur(2px);
}
#busy[hidden] { display: none; }
#busy .card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 28px;
  box-shadow: var(--shadow);
  text-align: center;
  min-width: 250px;
}
#busy .spin {
  width: 26px;
  height: 26px;
  margin: 0 auto 12px;
  border: 3px solid var(--panel-3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#busy .what { font-weight: 600; }
#busy .detail { color: var(--text-faint); font-size: 11.5px; margin-top: 5px; }

#drop-hint {
  position: fixed;
  inset: 0;
  z-index: 150;
  display: grid;
  place-items: center;
  background: rgba(8, 11, 15, 0.82);
  border: 2px dashed var(--accent);
  font-size: 17px;
  font-weight: 600;
}
#drop-hint[hidden] { display: none; }

/* ------------------------------------------------------ small screens */

@media (max-width: 560px) {
  #title-chip { font-size: 11px; padding: 6px 11px; }
  .brush-grid { grid-template-columns: repeat(3, 1fr); }
  .shortcut-grid { grid-template-columns: 1fr; }
  .prim-grid { grid-template-columns: repeat(2, 1fr); }
}

/*
 * Held vertically — a phone, or a tablet in portrait.
 *
 * A column of brushes down the side eats width that a tall screen cannot
 * spare, so the brushes move to a scrolling row along the bottom with the
 * two sliders just above them, and the model gets the whole middle. This is
 * the shape a one-handed sculpting app wants.
 */
@media (orientation: portrait) {
  #brushes {
    left: 0;
    right: 0;
    top: auto;
    bottom: 0;
    transform: none;
    flex-direction: row;
    gap: 7px;
    padding: 9px 10px calc(9px + env(safe-area-inset-bottom, 0px));
    overflow-x: auto;
    overflow-y: hidden;
    background: linear-gradient(to top, rgba(11, 14, 18, 0.94), rgba(11, 14, 18, 0.74));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line-soft);
    scrollbar-width: none;
    scroll-padding: 10px;
  }
  #brushes::-webkit-scrollbar { display: none; }
  .tool {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 15px;
    background: var(--panel-2);
    backdrop-filter: none;
  }
  .tool svg { width: 25px; height: 25px; }
  .tool.on { background: var(--accent-soft); }

  #bar-bottom {
    left: 10px;
    right: 10px;
    bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    transform: none;
    max-width: none;
    gap: 7px;
  }
  .pill { flex: 1 1 0; width: auto; max-width: none; padding: 8px 13px; }

  #bar-right {
    top: auto;
    right: 10px;
    bottom: calc(142px + env(safe-area-inset-bottom, 0px));
    transform: none;
    flex-direction: row;
    gap: 7px;
  }

  #bar-top {
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: 10px;
    right: 10px;
  }
  button.round { width: 42px; height: 42px; }
  button.round.big { width: 46px; height: 46px; }

  #stats { display: none; }

  /* sheets fill the width and sit against the bottom edge */
  .sheet {
    left: 0;
    right: 0;
    bottom: 0;
    margin-left: 0;
    width: 100%;
    max-height: 76vh;
    border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet-row { padding: 12px 10px; }
  .sheet-label b { font-size: 14px; }
  #toasts { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .backdrop { padding: 10px; align-items: flex-end; }
  .dialog { max-height: 86vh; width: 100%; }
}

/* a short, wide window (a phone on its side) keeps the side column but
   tucks it up under the top bar */
@media (orientation: landscape) and (max-height: 520px) {
  #brushes { top: 12px; transform: none; }
  #bar-right { top: 12px; transform: none; padding-top: 52px; }
  #stats { display: none; }
}
</style>
</head>

   * quat
   * ------------------------------------------------------------------ */

    if (V3.lenSq(fwd) < 1e-12) V3.perpendicular(fwd, nrm);
    else {
      var d = V3.dot(fwd, nrm);
      V3.set(fwd, fwd[0] - nrm[0] * d, fwd[1] - nrm[1] * d, fwd[2] - nrm[2] * d);
      if (V3.lenSq(fwd) < 1e-12) V3.perpendicular(fwd, nrm); else V3.normalize(fwd, fwd);
    }
    var side = V3.cross(V3.create(0, 0, 0), nrm, fwd);
    V3.normalize(side, side);
    var offset = ctx.radius * ctx.clay * 1.1 * s;
    var px = ctx.planePoint[0] + nrm[0] * offset;
    var py = ctx.planePoint[1] + nrm[1] * offset;
    var pz = ctx.planePoint[2] + nrm[2] * offset;
    var inv = 1 / (ctx.radius || 1e-9);
    var strength = ctx.strength;

      var a = Math.abs(rx * fwd[0] + ry * fwd[1] + rz * fwd[2]) * inv;
      var b = Math.abs(rx * side[0] + ry * side[1] + rz * side[2]) * inv;

      var weight = ctx.falloff(S.clamp(box * 1.6, 0, 1)) * (1 - mesh.masks.array[v]);
      var dist = (pos[o] - px) * nrm[0] + (pos[o + 1] - py) * nrm[1] + (pos[o + 2] - pz) * nrm[2];
      if (s > 0 ? dist >= 0 : dist <= 0) continue;
      var move = -dist * strength * weight;
      pos[o] += nrm[0] * move;
      pos[o + 1] += nrm[1] * move;

   * strength across most of the footprint so the patch lands *on* the plane
   * and meets the untouched surface at a crisp edge. That is what makes it

   * below is raised, so repeated strokes carve a facet instead of inflating

      // the high point. This depth is what one pass shaves off.
      // measured once at the start of the stroke: the brush radius changes

      // using the live value would step the plane and terrace the cut

      var w = f * 2.2;

      pos[o + 1] += ny * move;
      pos[o + 2] += nz * move;

  function StrokeEngine(deps) {

    this.history = deps.history;

    this.camera = deps.camera;
    this.ctx = new BrushContext();
    this.active = false;
    this.brush = null;

    this._o = V3.create(0, 0, 0);
    this._d = V3.create(0, 0, 0);
    this._lp = V3.create(0, 0, 0);
    this._ld = V3.create(0, 0, 0);
    this._tmp = V3.create(0, 0, 0);
    this._tmp2 = V3.create(0, 0, 0);
    this._prevLocal = V3.create(0, 0, 0);
    this._prevWorld = V3.create(0, 0, 0);
    this._anchorWorld = V3.create(0, 0, 0);
    this._anchorLocal = V3.create(0, 0, 0);
    this._anchorNormal = V3.create(0, 1, 0);

    var hit = this.pick(input.x, input.y, true);
    if (!hit) {
      // grab-style brushes need a surface to anchor to; everything else too
      return false;
    }
    this.active = true;
    this.brush = brush;
    this.obj = hit.object;
    this.stamps = 0;
    this.strokeInvert = !!input.invert;
    this.strokeSmooth = !!input.smooth;
    this.pressure = input.pressure === undefined ? 1 : input.pressure;

    V3.copy(this._anchorWorld, hit.point);
    V3.copy(this._anchorLocal, hit.localPoint);
    V3.copy(this._anchorNormal, hit.localNormal);
    V3.copy(this._prevLocal, hit.localPoint);
    V3.copy(this._prevWorld, hit.point);
    this._screen[0] = this._prevScreen[0] = this._smoothScreen[0] = input.x;
    this._screen[1] = this._prevScreen[1] = this._smoothScreen[1] = input.y;
    this.pendingDistance = 0;

    var topo = this.usesDyntopo();
    this.history.beginStroke(this.obj, {
      label: brush.label,
      topology: topo,
      colors: !!brush.paint,
      masks: !!brush.mask

    this.anchorRadius = this.localRadius(this._anchorWorld);
    this.ctx.origin = (brush.grab || brush.id === 'layer') ? new Map() : null;
    this.grabVerts = null;

    // for the whole stroke instead of picking up new vertices as it goes

  StrokeEngine.prototype.usesDyntopo = function () {
    var st = this.settings;

    if (b.paint || b.mask) return false;
    return true;
  };

  StrokeEngine.prototype.localRadius = function (worldPoint) {
    var st = this.settings;
    var perPixel = this.camera.worldPerPixel(worldPoint);

    var world = px * perPixel;

  StrokeEngine.prototype.captureGrabSet = function () {
    var mesh = this.obj.mesh;

    var verts = mesh.vertsInSphere(this._anchorLocal[0], this._anchorLocal[1], this._anchorLocal[2], r);
    this.grabVerts = Uint32Array.from(verts);

  A.syncViewButtons = function () {
    if (this.symBtn) {
      var any = this.settings.symmetryX || this.settings.symmetryY || this.settings.symmetryZ;
      this.symBtn.classList.toggle('on', !!any);
      var axes = (this.settings.symmetryX ? 'X' : '') + (this.settings.symmetryY ? 'Y' : '') + (this.settings.symmetryZ ? 'Z' : '');
      this.symBtn.title = 'Mirror ' + (axes || 'off') + ' (X, Y, Z)';
    }
  };

  A.refreshStatus = function () {
    var obj = this.scene.current();
    if (this.titleChip) {
      var budget = this.settings.triBudget;
      var tris = obj ? obj.mesh.liveTris : 0;
      this.titleChip.textContent = S.formatCount(tris) + ' / ' + S.formatCount(budget);
      this.titleChip.classList.toggle('over', tris > budget);
      this.titleChip.classList.toggle('near', tris > budget * 0.85 && tris <= budget);
      this.titleChip.title = obj ? (obj.name + ' — ' + tris + ' triangles, budget ' + budget) : '';
    }
    if (this.undoBtn) this.undoBtn.disabled = !this.history.canUndo();
    if (this.redoBtn) this.redoBtn.disabled = !this.history.canRedo();
    if (this.sizePill) this.sizePill.set(this.settings.radius);
    if (this.strengthPill) this.strengthPill.set(this.settings.strength);
    this.syncViewButtons();
    if (this.sheetRefresh) this.sheetRefresh();
  };

  A.updateHud = function () {
    var obj = this.scene.current();
    if (!obj) { this.hudEl.textContent = ''; return; }
    var bits = [S.formatCount(obj.mesh.liveTris) + ' tris'];
    if (this.settings.dyntopo) bits.push('dyntopo');
    var axes = (this.settings.symmetryX ? 'X' : '') + (this.settings.symmetryY ? 'Y' : '') + (this.settings.symmetryZ ? 'Z' : '');
    if (axes) bits.push('mirror ' + axes);
    bits.push(this.fps + ' fps');
    this.hudEl.textContent = bits.join('   ');
  };

  /* placeholder so old call sites stay valid; the material sheet rebuilds
     its own swatches when it opens */
  A.syncMatcaps = function () {
    if (!this.matcapButtons) return;
    for (var k in this.matcapButtons) {
      this.matcapButtons[k].classList.toggle('on', k === this.settings.matcap);
    }
  };

    UI.toast(labelFor(key) + (this.settings[key] ? ' on' : ' off'), null, 1200);

  function labelFor(key) {
    return ({
      wireframe: 'Wireframe', flat: 'Flat shading', grid: 'Grid', ortho: 'Orthographic',
      symmetryX: 'Mirror X', symmetryY: 'Mirror Y', symmetryZ: 'Mirror Z',
      dyntopo: 'Dynamic topology', navigateMode: 'One-finger orbit',
      vertexColors: 'Vertex colour'
    })[key] || key;

  /* ================================================================ *
   * sheets
   *
   * One at a time, sliding up from the bottom (or centred on a wide
   * screen). Rows are big enough for a thumb and carry a one-line
   * explanation, so nothing needs a manual.
   * ================================================================ */

  A.closeSheet = function () {
    if (this._sheet) {
      var s = this._sheet;
      this._sheet = null;
      this.sheetRefresh = null;
      s.classList.remove('open');
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 180);
    }
  };

  /**
   * Show a sheet. `spec` is {title, rows} or {title, content}.
   * A row is {icon, label, hint, onclick, toggle, value, danger, chevron}.
   */
  A.openSheet = function (spec) {
    var self = this;
    this.closeSheet();
    var body = el('div.sheet-body');
    var sheet = el('div.sheet', null, [
      el('div.sheet-head', null, [
        spec.back ? el('button.round.small', { title: 'Back', onclick: function () { spec.back(); } }, UI.icon('chevron')) : null,
        el('h3', { text: spec.title }),
        el('div.spring'),
        el('button.round.small', { title: 'Close', onclick: function () { self.closeSheet(); } }, UI.icon('close'))
      ]),
      body
    ]);

    if (spec.content) UI.append(body, spec.content);
    if (spec.rows) {
      spec.rows.forEach(function (row) {
        if (!row) return;
        if (row.group) {
          body.appendChild(el('div.sheet-group', { text: row.group }));
          return;
        }
        var right = null;
        if (row.toggle) {
          right = el('span.switch' + (row.value() ? '.on' : ''));
        } else if (row.chevron) {
          right = UI.icon('chevron');
          right.classList.add('go');
        } else if (row.note) {
          right = el('span.row-note', { text: row.note });
        }
        var node = el('button.sheet-row' + (row.danger ? '.danger' : ''), {
          onclick: function () {
            if (row.toggle) {
              row.onclick();
              right.classList.toggle('on', !!row.value());
              return;                      // toggles keep the sheet open
            }
            if (!row.keepOpen) self.closeSheet();
            row.onclick();
          }
        }, [
          row.icon ? UI.icon(row.icon) : el('span.no-icon'),
          el('span.sheet-label', null, [
            el('b', { text: row.label }),
            row.hint ? el('small', { text: row.hint }) : null
          ]),
          right
        ]);
        body.appendChild(node);
      });
    }
    this.sheetHost.appendChild(sheet);
    this._sheet = sheet;
    // let the browser lay it out before starting the slide-up
    requestAnimationFrame(function () { sheet.classList.add('open'); });
    return sheet;
  };

  /**
   * Bring the object list up to date.
   *
   * Rows are updated in place when the list has not changed shape. Tearing
   * them down and rebuilding on every selection detached the element under
   * the pointer — which swallowed the click that caused it — and flickered.
   */
  A.refreshObjects = function () {
    var self = this;
    var host = this.objectsHost;
    if (!host || !host.parentNode) return;
    var objs = this.scene.objects;

    if (host.children.length === objs.length) {
      for (var i = 0; i < objs.length; i++) {
        var row = host.children[i];
        var obj = objs[i];
        row.classList.toggle('on', i === self.scene.selected);
        var eye = row.querySelector('button');
        var wantVisible = obj.visible ? '1' : '0';
        if (eye.dataset.visible !== wantVisible) {
          eye.dataset.visible = wantVisible;
          eye.classList.toggle('off', !obj.visible);
          UI.clear(eye);
          eye.appendChild(UI.icon(obj.visible ? 'eye' : 'eyeOff'));
        }
        var name = row.querySelector('.name');
        if (document.activeElement !== name && name.value !== obj.name) name.value = obj.name;
        row.querySelector('.count').textContent = S.formatCount(obj.mesh.liveTris);
      }
      return;
    }

    UI.clear(host);
    objs.forEach(function (obj, i) {
      var nameInput = el('input.name', { type: 'text', value: obj.name, onchange: function () {
        obj.name = nameInput.value || obj.name;
        self.refreshStatus();
      } });
      var eye = el('button' + (obj.visible ? '' : '.off'), { title: 'Show or hide', onclick: function () {
        obj.visible = !obj.visible;
        self.refreshObjects();
        self.needsRender = true;
      } }, UI.icon(obj.visible ? 'eye' : 'eyeOff'));
      eye.dataset.visible = obj.visible ? '1' : '0';
      var row = el('div.obj-row' + (i === self.scene.selected ? '.on' : ''), {
        onpointerdown: function (e) {
          if (e.target.closest('button')) return;
          if (self.scene.selected === i) return;
          self.scene.selected = i;
          self.refreshObjects();
          self.refreshStatus();
          self.needsRender = true;
        }
      }, [eye, nameInput, el('span.count', { text: S.formatCount(obj.mesh.liveTris) })]);
      host.appendChild(row);
    });
  };
