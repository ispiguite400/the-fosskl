<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <!-- 3D viewport -->
  <canvas id="gl"></canvas>

  <!-- All 2D UI is injected into these layers by src/ui/* -->
  <div id="ui-root">
    <div id="layer-game"></div>   <!-- HUD, missions, hotbar -->
    <div id="layer-screens"></div><!-- loading / menu / class / edit / settings -->
    <div id="layer-modal"></div>  <!-- inventory, dialogue, shop -->
    <div id="layer-cine"></div>   <!-- letterbox, fades, subtitles -->
  </div>

  <div id="rotate-hint">Rotate your device / widen the window</div>

  <noscript style="color:#fff;font:16px sans-serif;padding:2rem;display:block">
    This game requires JavaScript and WebGL2.
  </noscript>

  <script type="module" src="src/main.js"></script>

</html>
